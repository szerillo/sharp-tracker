name: kalshi backfill, tennis (settled match + set-winner markets + trade tape)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        series: [KXATPMATCH, KXWTAMATCH, KXATPSETWINNER, KXWTASETWINNER, KXATPCHALLENGERMATCH, KXWTACHALLENGERMATCH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pandas
      - name: pull ${{ matrix.series }}
        run: python3 loggers/kalshi_history.py --series ${{ matrix.series }} --max-pages 8
      - name: upload to the kalshi-history release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tennis has no kickoff lookup: trades include in-play; cut them in analysis with the ESPN match start (data/tennis/results.jsonl)
          gh release view kalshi-history >/dev/null 2>&1 || gh release create kalshi-history --title "Kalshi history pulls" --notes "settled sports markets and trade tapes, one asset per series" || true
          cp data/kalshi/history/markets.jsonl markets-${{ matrix.series }}.jsonl
          gh release upload kalshi-history data/kalshi/history/trades/${{ matrix.series }}.jsonl.gz markets-${{ matrix.series }}.jsonl --clobber
