name: pulse (scheduler)
# GitHub's cron fired the 20-minute jobs about four times a day (checked 2026-10-30: 4 scheduled runs each for prices and tracker in
# 24 hours; prices_fast never). This job is the clock instead: it runs for ~55 minutes, dispatching prices_fast every 5 minutes and
# prices / tracker on their 20-minute slots inside the 10 AM to 2 AM ET window, then dispatches itself. The cron below is only the
# restart if a pulse ever dies. Since 11/1 it runs around the clock: prices / tracker / Pages every 20 minutes all day, the 5-minute tape
# every 5 minutes 10 AM-2 AM ET and every 10 minutes overnight (prices.yml carries the tennis lines, so the overnight tennis job is not
# needed). cancel-in-progress collapses overlapping pulses.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
concurrency:
  group: pulse
  cancel-in-progress: true
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: dispatch the loggers on their slots for 55 minutes, then hand off
        run: |
          fire() { gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/dispatches" -f ref=main >/dev/null 2>&1 && echo "$(date -u +%H:%M) -> $1" || echo "$(date -u +%H:%M) failed $1"; }
          end=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $end ]; do
            h=$(TZ=America/New_York date +%H); m=$(date -u +%M); m=$((10#$m))
            if [ $h -ge 10 ] || [ $h -le 1 ]; then
              fire prices_fast.yml
            elif [ $(( m % 10 )) -lt 5 ]; then     # 2-10 AM ET (11/1): the 5-minute tape every 10 minutes, so early soccer kickoffs and overnight
              fire prices_fast.yml                 # Pinnacle moves on NFL / CFB lines are on the move tape (it was tennis only before)
            fi
            case $(( m % 20 )) in                  # 20-minute price log, tracker and publish around the clock (the repo is public: no minute cap)
              0|1|2|3|4) fire prices.yml ;;
              10|11|12|13|14) fire signals.yml ;;    # 11/4 (Sean): market / sharp board every 20 minutes; systems only a few times a day
              15|16|17|18|19) fire pages.yml ;;     # workflow_run does not fire for runs started with GITHUB_TOKEN, so publish from here
            esac
            # full tracker (price database + systems engine): every hour at :40, 9:40 AM to 9:40 PM ET (Sean, 11/7: lines that move into a
            # system's range late in the day were missed with three runs a day; systems now fill 1-30 h before the start)
            mm=$((10#$(TZ=America/New_York date +%M))); hh=$((10#$h))
            if [ $hh -ge 9 ] && [ $hh -le 21 ] && [ $mm -ge 40 ] && [ $mm -lt 45 ]; then fire tracker.yml; fi
            # expert pick log (11/8): 4 times a day so settled picks are caught before they roll off the profile pages
            case $hh in 12|17|23|3) if [ $mm -ge 50 ] && [ $mm -lt 55 ]; then fire experts.yml; fi ;; esac
            sleep 300
          done
          fire pulse.yml
