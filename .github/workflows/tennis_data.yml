name: tennis data (Tennis Abstract)
# Sean, 11/4: Jeff Sackmann's Tennis Abstract match database (github.com/JeffSackmann/tennis_atp and tennis_wta), for the tennis models:
# every tour-level, Challenger, qualifying and ITF match since 2015 with the set-by-set score string, surface, level, best-of, ranks,
# rank points, seeds, ages, hands, heights and the per-match serve stats (aces, DFs, first-serve in/won, break points), plus the player
# and current-ranking tables. Pulled on GitHub's runner (the research container cannot reach other GitHub repos), gzipped into
# data/tennis/ta/. Weekly: the upstream repos update about once a week. Research reads these files; nothing live depends on them.
on:
  schedule:
    - cron: '23 9 * * 2'      # Tuesdays 4:23 AM ET
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tennis-data
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: shallow-clone Tennis Abstract and copy the files we use
        run: |
          set -e
          mkdir -p data/tennis/ta
          # the original JeffSackmann/tennis_atp and tennis_wta repos no longer answer (11/4); the Aneeshers/tennis-sackmann-archive mirror
          # (atp/ and wta/ folders, through 2026) is the fallback. Sparse checkout: the slam point-by-point folder is most of its 800 MB.
          for tour in atp wta; do
            if git clone -q --depth 1 https://github.com/JeffSackmann/tennis_$tour /tmp/$tour 2>/dev/null; then echo "upstream $tour"; else
              if [ ! -d /tmp/mirror ]; then
                git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Aneeshers/tennis-sackmann-archive /tmp/mirror
                (cd /tmp/mirror && git sparse-checkout set atp wta)
              fi
              rm -rf /tmp/$tour; cp -r /tmp/mirror/$tour /tmp/$tour; echo "mirror $tour"
            fi
            for y in $(seq 2015 2026); do
              for f in ${tour}_matches_$y.csv ${tour}_matches_qual_chall_$y.csv ${tour}_matches_qual_itf_$y.csv ${tour}_matches_futures_$y.csv; do
                [ -f /tmp/$tour/$f ] && gzip -c /tmp/$tour/$f > data/tennis/ta/$f.gz
              done
            done
            for f in ${tour}_players.csv ${tour}_rankings_current.csv ${tour}_rankings_20s.csv; do
              [ -f /tmp/$tour/$f ] && gzip -c /tmp/$tour/$f > data/tennis/ta/$f.gz
            done
            (cd /tmp/$tour && git log -1 --format='%H %cd' --date=iso 2>/dev/null || (cd /tmp/mirror && echo "mirror $(git log -1 --format='%H %cd' --date=iso)")) > data/tennis/ta/${tour}_upstream.txt
          done
          ls -la data/tennis/ta | head -60; du -sh data/tennis/ta
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: rebuild the set-1 model and the player profiles from the new data
        run: python3 sharp/tennis_ta.py --map || true
      - name: commit
        run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A data/tennis/ta data/research/tennis_set1_map.json data/state/tennis_profiles.json
          git commit -q -m "tennis data (Tennis Abstract) $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs --no-tags origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
