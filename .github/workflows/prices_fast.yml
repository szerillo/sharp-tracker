name: prices fast (5-minute move tape)
# Pinnacle + Novig + Kalshi game markets and Kalshi trades every 5 minutes, 10 AM to 1:59 AM ET (cron is UTC, EDT = UTC-4), for
# the move framework (docs/sharp_framework_v2_scope.md). Actions cron jitter is 1 to 4 minutes; rows carry their true timestamps.
on:
  schedule:
    - cron: '*/5 14-23,0-6 * * *'   # UTC; covers both EDT and EST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prices-fast
  cancel-in-progress: false
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # 11/9: was 9; 15 was not enough either (the trades job took 14.7 min at 7:32 PM). Evening runs need ~7 min of data steps, so the commit was killed at 9 every run from 5:30 PM ET
    strategy:
      fail-fast: false
      matrix:
        group: ['nfl,nba,nhl', 'cfb,soccer,mma', 'cbb', 'trades', 'tennis']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: fast tape (${{ matrix.group }})
        timeout-minutes: 7
        env:
          LINES_BUDGET_S: '50'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOVIG_KEY_ID: ${{ secrets.NOVIG_KEY_ID }}
          NOVIG_PRIVATE_KEY: ${{ secrets.NOVIG_PRIVATE_KEY }}
        run: |
          pip install -q cryptography
          if [ "${{ matrix.group }}" = "trades" ]; then python3 loggers/poly_sharps.py || true; python3 sharp/sharp_live.py || true; python3 loggers/fast.py --trades || true; python3 sharp/kalshi_flow.py || true
          elif [ "${{ matrix.group }}" = "tennis" ]; then python3 loggers/tennis_lines.py --fast || true
          else python3 loggers/fast.py --sports ${{ matrix.group }} || true; fi
      - name: commit
        run: |
          git config user.name "prices-bot"; git config user.email "actions@users.noreply.github.com"
          for d in data/*/ticks5 data/kalshi/trades5 data/novig/trades5 data/kalshi/trades5_soft data/novig/trades5_soft data/kalshi/*.json data/tennis/events.json data/polymarket/sharp_fills.jsonl data/polymarket/sharp_prop_fills.jsonl data/polymarket/_sharp_meta.json data/polymarket/_sharp_state.json data/state/sharp_accounts.json data/state/sharp_paper.jsonl data/state/sharp_alerts.json data/state/sys_sharp_tags.jsonl data/state/kalshi_flow.json data/kalshi/flow_paper.jsonl; do [ -e "$d" ] && git add "$d"; done; git commit -m "fast $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
