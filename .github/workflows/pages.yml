name: pages (publish dashboard)
# Publishes the dashboard to GitHub Pages after every tracker run and on demand. Uses the Actions deployment path so Pages
# turns itself on (enablement: true) without touching repo settings by hand. Only index.html + data/state are published.
on:
  workflow_run:
    workflows: ["tracker (fold, grade, export)"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  # 11/9: renamed from 'pages'. A run stuck 'waiting' at the github-pages gate since the 1 PM GitHub outage held that queue and could not be
  # cancelled (GitHub refuses: 'not been queued yet'); every later publish waited behind it and was replaced.
  group: pages-publish
  # 11/7: never cancel a deploy mid-sync. Cancelling left GitHub's side 'syncing' and the next deploys timed out (12:06-12:44 PM ET, the
  # board went stale). A running deploy finishes; only the newest waiting run is kept behind it.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_b.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # 11/25 debounce: at most one publish every 4 minutes. A run waits out the rest of the 4 minutes after the last successful publish,
      # then checks out main as it is at that moment, so the publish is always the latest commit (newer dispatches queue one behind it).
      - name: debounce (4 minutes since the last successful publish)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?status=success&per_page=1" -q '.workflow_runs[0].updated_at' 2>/dev/null || true)
          [ -n "$last" ] || exit 0
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) )); wait=$(( 240 - age ))
          [ "$wait" -gt 0 ] && { echo "last publish ${age}s ago, waiting ${wait}s"; sleep "$wait"; } || true
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: check the page script parses before publishing (a syntax error blanks the whole board)
        run: |
          python3 -c "import re; h=open('index.html').read(); s=re.findall(r'<script>(.*?)</script>', h, re.S); open('/tmp/page.js','w').write('\n'.join(s))"
          node --check /tmp/page.js
      - name: assemble site
        run: |
          mkdir -p _site/data/state
          cp index.html _site/
          cp data/state/*.json _site/data/state/ 2>/dev/null || true
          mkdir -p _site/data/research && cp data/research/poly_pinnacle.json _site/data/research/ 2>/dev/null || true     # the sharp backtest line on the board
          cp -r docs _site/docs
          # 11/20 (Sean): keep every published page out of search. index.html carries the tag; this adds it to any other .html that lands
          # in the site later (docs/ is published as-is). JSON feeds keep their URLs and are untouched.
          for f in $(find _site -name '*.html'); do grep -qi 'name="robots"' "$f" || sed -i '0,/<head[^>]*>/s//&\n<meta name="robots" content="noindex,nofollow">/' "$f"; done
          missing=$(grep -L -i 'name="robots"' $(find _site -name '*.html')); [ -z "$missing" ] || { echo "missing the noindex tag: $missing"; exit 1; }
          ls -la _site _site/data/state
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      # 11/25 root cause of the 20:10-23:30Z outage: deploy-pages looked the artifact up 0.3 s after the upload and found none ("No artifacts
      # named github-pages"), and the old recovery step then cancelled the Pages deployment of every recent commit sha, including the
      # one this run was about to deploy and the shas later runs would deploy. A deployment created under an id that had already been
      # cancelled never leaves its blank status, so every retry waited 10 minutes and timed out. Now: wait 20 s for the artifact to
      # register, retry once without cancelling anything, and if a deploy is really stuck cancel only genuine open deployments,
      # never this run's own sha. Short timeouts: a healthy deploy reports success in about 5 s.
      - name: let the artifact register
        run: sleep 20
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: {timeout: 240000}
      - id: deployment_b
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: {timeout: 240000}
      - name: clear a genuinely stuck deployment (never this run's own sha)
        if: steps.deployment.outcome == 'failure' && steps.deployment_b.outcome == 'failure'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          for id_sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" -q '.[] | "\(.id):\(.sha)"'); do
            id=${id_sha%%:*}; s=${id_sha##*:}; [ "$s" = "${{ github.sha }}" ] && continue
            st=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" -q '.[0].state' 2>/dev/null)
            case "$st" in queued|in_progress|pending) gh api -X POST "repos/${{ github.repository }}/pages/deployments/$s/cancel" >/dev/null 2>&1 && echo "cancelled stuck deployment $s ($st)";; esac
          done; true
      - id: deployment2
        if: steps.deployment.outcome == 'failure' && steps.deployment_b.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: {timeout: 300000}
  # 11/6 (Sean: "Why do we keep having things that aren't showing up on the board? We can't have that."): after every publish, open the
  # live page in a real browser and check every sized open bet in the tracker has a visible row; a phone alert and a red run if not.
  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # 11/8: commits the Grade C sharp rows the check reads off the page (data/state/sharp_c_paper.jsonl)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sharp/board_check.js
            sharp/sharp_c_log.py
            data/state/sharp_c_paper.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: install the browser
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: board check (every sized open bet visible on the live page)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: sleep 45 && node sharp/board_check.js "${{ needs.deploy.outputs.page_url || 'https://szerillo.github.io/sharp-tracker/' }}"
      - name: log Grade C sharp rows (sharp accounts plus money or a price move, no flag) for the bet tracker
        if: always()
        run: |
          [ -f board_check.json ] || exit 0
          python3 sharp/sharp_c_log.py board_check.json data/state/sharp_c_paper.jsonl || exit 0
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/state/sharp_c_paper.jsonl; git commit -q -m "grade C sharp rows $(date -u +%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --no-tags origin main && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
