name: pages (publish dashboard)
# Publishes the dashboard to GitHub Pages after every tracker run and on demand. Uses the Actions deployment path so Pages
# turns itself on (enablement: true) without touching repo settings by hand. Only index.html + data/state are published.
on:
  workflow_run:
    workflows: ["tracker (fold, grade, export)"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: check the page script parses before publishing (a syntax error blanks the whole board)
        run: |
          python3 -c "import re; h=open('index.html').read(); s=re.findall(r'<script>(.*?)</script>', h, re.S); open('/tmp/page.js','w').write('\n'.join(s))"
          node --check /tmp/page.js
      - name: assemble site
        run: |
          mkdir -p _site/data/state
          cp index.html _site/
          cp data/state/*.json _site/data/state/ 2>/dev/null || true
          mkdir -p _site/data/research && cp data/research/poly_pinnacle.json _site/data/research/ 2>/dev/null || true     # the sharp backtest line on the board
          cp -r docs _site/docs
          ls -la _site _site/data/state
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@v4
  # 11/6 (Sean: "Why do we keep having things that aren't showing up on the board? We can't have that."): after every publish, open the
  # live page in a real browser and check every sized open bet in the tracker has a visible row; a phone alert and a red run if not.
  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: sharp/board_check.js, sparse-checkout-cone-mode: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: install the browser
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: board check (every sized open bet visible on the live page)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: sleep 45 && node sharp/board_check.js "${{ needs.deploy.outputs.page_url || 'https://szerillo.github.io/sharp-tracker/' }}"
