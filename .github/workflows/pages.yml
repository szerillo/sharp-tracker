name: pages (publish dashboard)
# Publishes the dashboard to GitHub Pages after every tracker run and on demand. Uses the Actions deployment path so Pages
# turns itself on (enablement: true) without touching repo settings by hand. Only index.html + data/state are published.
on:
  workflow_run:
    workflows: ["tracker (fold, grade, export)"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  # 11/9: renamed from 'pages'. A run stuck 'waiting' at the github-pages gate since the 1 PM GitHub outage held that queue and could not be
  # cancelled (GitHub refuses: 'not been queued yet'); every later publish waited behind it and was replaced.
  group: pages-publish
  # 11/7: never cancel a deploy mid-sync. Cancelling left GitHub's side 'syncing' and the next deploys timed out (12:06-12:44 PM ET, the
  # board went stale). A running deploy finishes; only the newest waiting run is kept behind it.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: check the page script parses before publishing (a syntax error blanks the whole board)
        run: |
          python3 -c "import re; h=open('index.html').read(); s=re.findall(r'<script>(.*?)</script>', h, re.S); open('/tmp/page.js','w').write('\n'.join(s))"
          node --check /tmp/page.js
      - name: assemble site
        run: |
          mkdir -p _site/data/state
          cp index.html _site/
          cp data/state/*.json _site/data/state/ 2>/dev/null || true
          mkdir -p _site/data/research && cp data/research/poly_pinnacle.json _site/data/research/ 2>/dev/null || true     # the sharp backtest line on the board
          cp -r docs _site/docs
          ls -la _site _site/data/state
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # 11/7: a deploy that timed out can stay 'in progress' on GitHub's side and block every later deploy ("Please cancel <sha> first").
      # Pages deployment ids are commit shas, so cancel any still-open one among the recent commits, then deploy again.
      - name: clear a stuck deployment and retry
        if: steps.deployment.outcome == 'failure'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          # the stuck one can be a commit later rebased off main, so also take the shas GitHub recorded for recent github-pages deployments
          for s in $( (gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=30" -q '.[].sha'; gh api "repos/${{ github.repository }}/commits?per_page=40" -q '.[].sha') | sort -u); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$s/cancel" >/dev/null 2>&1 && echo "cancelled stuck deployment $s"
          done; true
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
  # 11/6 (Sean: "Why do we keep having things that aren't showing up on the board? We can't have that."): after every publish, open the
  # live page in a real browser and check every sized open bet in the tracker has a visible row; a phone alert and a red run if not.
  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # 11/8: commits the Grade C sharp rows the check reads off the page (data/state/sharp_c_paper.jsonl)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sharp/board_check.js
            sharp/sharp_c_log.py
            data/state/sharp_c_paper.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: install the browser
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: board check (every sized open bet visible on the live page)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: sleep 45 && node sharp/board_check.js "${{ needs.deploy.outputs.page_url || 'https://szerillo.github.io/sharp-tracker/' }}"
      - name: log Grade C sharp rows (sharp accounts plus money or a price move, no flag) for the bet tracker
        if: always()
        run: |
          [ -f board_check.json ] || exit 0
          python3 sharp/sharp_c_log.py board_check.json data/state/sharp_c_paper.jsonl || exit 0
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/state/sharp_c_paper.jsonl; git commit -q -m "grade C sharp rows $(date -u +%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 10 + 3)); done
