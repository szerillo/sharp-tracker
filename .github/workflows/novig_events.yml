name: novig events fix (fill league/start on history catalog)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q cryptography
      - env:
          NOVIG_KEY_ID: ${{ secrets.NOVIG_KEY_ID }}
          NOVIG_PRIVATE_KEY: ${{ secrets.NOVIG_PRIVATE_KEY }}
        run: python3 loggers/novig_events_fix.py
      - run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A data/novig/catalog data/novig/events_history.jsonl.gz && git commit -m "novig events fix $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + 5))
          done
          exit 1
