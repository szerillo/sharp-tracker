name: novig maker history (public tape, every market type)
# 11/10 overnight: sharp/novig_maker_history.py reads Novig's public trade CSVs (not reachable from the analysis container). Manual.
on:
  workflow_dispatch:
    inputs:
      first: {description: 'first day', default: '2026-08-03', required: true}
      last: {description: 'last day (blank = yesterday)', default: '', required: false}
      debug: {description: 'set to 1 to print the file shape only', default: '', required: false}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: maker history
        env: {MAX_SECONDS: '19000', DEBUG_ROWS: '${{ inputs.debug }}'}
        run: python3 sharp/novig_maker_history.py ${{ inputs.first }} ${{ inputs.last }} 2>&1 | tee /tmp/novig_maker.txt
      - name: commit
        if: always()
        run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          if [ -n "${{ inputs.debug }}" ]; then exit 0; fi
          mkdir -p data/research; cp /tmp/novig_maker.txt data/research/novig_maker_history.txt || true
          git add -f data/research/novig_maker_history.json data/research/novig_maker_history.txt
          git commit -q -m "novig maker history" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done
