name: signals (market and sharp board, every 10 minutes)
# Sean, 11/4: systems only need a couple of pulls a day; the market and Polymarket sharp information needs to update all day.
# This job refreshes everything on the board that comes from the live tapes, without the price-database rebuild the systems engine
# needs: the big-money / Kalshi-move watch, the tennis set-1 watch, the move tape, the duplicate cleanup and the bet tracker.
# (Polymarket sharp flags already refresh every 5 minutes in prices_fast.) The full tracker (systems engine) runs 3 times a day.
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 11/7: runs reached 20 min and were cut off before the commit (no board update 2:10-3:30 PM ET)
    steps:
      - uses: actions/checkout@v4     # 11/8: skip the Odds API history (about 540 MB; nothing in this job reads it), checkout was ~2 min
        with:
          sparse-checkout: |
            /*
            !/data/oddsapi/
          sparse-checkout-cone-mode: false
          filter: blob:none      # fetch only the files checked out (the full fetch was ~2 min)
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pandas
      - name: read the latest system-bet files from main (owned by the tracker job; this checkout may predate its last commit)
        run: git fetch -q origin main && git checkout -q origin/main -- data/state/system_fires.json data/state/system_fired.json data/state/fills.jsonl data/state/sharp_accounts.json data/state/sharp_paper.jsonl || true
      # 11/7 (Sean: "have it update quicker"): these steps read different inputs and write different files, so they run at the same time
      # 11/8: the move tape (the slowest, ~4.5 min) runs in its own job, moves.yml, at the same time. (Was one after another: about 7 minutes of a 20-minute run; now about as long as the slowest, the move tape). Each one's output is
      # printed after, in order; a failure in one never stops the others (each was '|| true' before too).
      - name: exchange money split, tape check, tennis, MMA steam and the late pass, in parallel
        env: {MOVES_DAYS: '3', ODDS_API_KEY: '${{ secrets.ODDS_API_KEY }}'}
        run: |
          mkdir -p /tmp/par; T0=$SECONDS
          ( python3 sharp/flow_live.py ; echo "[took $((SECONDS - T0)) s]" ) > /tmp/par/1_flow.log 2>&1 &
          ( python3 sharp/tape_health.py ; echo "[took $((SECONDS - T0)) s]" ) > /tmp/par/3_tape.log 2>&1 &
          ( python3 loggers/tennis_scores.py --days-back 2 && python3 sharp/tennis_watch.py ; echo "[took $((SECONDS - T0)) s]" ) > /tmp/par/4_tennis.log 2>&1 &
          ( python3 sharp/mma_steam.py ; echo "[took $((SECONDS - T0)) s]" ) > /tmp/par/5_mma.log 2>&1 &
          ( BUILD_DB=data/state/soon.sqlite BUILD_SOON_H=2.5 python3 sharp/build_db.py && python3 sharp/late_pass.py ; echo "[took $((SECONDS - T0)) s]" ) > /tmp/par/6_late.log 2>&1 &
          wait
          for f in /tmp/par/*.log; do echo "::group::$(basename $f)"; cat "$f"; echo "::endgroup::"; done
      - name: remove duplicate bets from the records
        run: python3 sharp/dedupe_fills.py || true
      - name: stale-book paper lean (a bettable venue 2%+ better than Pinnacle's fair right after Pinnacle moved toward the side; 11/6)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: |
          if ! python3 sharp/stale_live.py; then
            echo "::error::Stale-book feed failed"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Stale-book feed failed" -H "Priority: default" -d "Stale-book feed crashed in run $GITHUB_RUN_ID; its flags did not update" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: offers to rest (Kalshi and Novig sides whose best bid is 3c+ under Pinnacle's fair; paper, 11/10)
        run: |
          python3 sharp/offers_live.py || echo "::warning::offers scan failed"
          python3 sharp/offers_grade.py || echo "::warning::offers grade failed"
      - name: prop price-gap paper leans (NBA threes / NHL saves and shots unders where FD, Caesars or DK beat Pinnacle's no-vig by 2%+; 11/6)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}', ODDS_API_KEY: '${{ secrets.ODDS_API_KEY }}'}
        run: |
          if ! python3 sharp/props_live.py; then
            echo "::error::Props feed failed"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Props feed failed" -H "Priority: default" -d "Props feed crashed in run $GITHUB_RUN_ID; its flags did not update" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: derivatives off the curve (CBB first-half totals, CFB first-quarter and team-total unders; 11/6)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}', ODDS_API_KEY: '${{ secrets.ODDS_API_KEY }}'}
        run: |
          if ! python3 sharp/curve_live.py; then
            echo "::error::Curve feed failed"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Curve feed failed" -H "Priority: default" -d "Curve feed crashed in run $GITHUB_RUN_ID; its flags did not update" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: bet tracker
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: |     # 11/6: a crash used to pass silently; now it alerts, and the job still commits everything else
          if ! python3 sharp/bet_log.py; then
            echo "::error::Bet tracker failed"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Bet tracker failed" -H "Priority: high" -d "Bet tracker crashed in run $GITHUB_RUN_ID; the board keeps the previous build" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: board audit (open bets on the board, freshness, duplicates, feeds; red banner + phone alert on a new failure)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: python3 sharp/audit.py || true
      - name: commit
        run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          # 11/6: the tracker job owns system_fires.json / system_fired.json. If it committed a newer build while this job ran, take its
          # files instead of this job's (older) copies; the late pass redoes its small edits on the next run 20 minutes later.
          git fetch -q origin main && python3 - <<'PY' || true
          import json, subprocess
          def built(txt):
              try: return json.loads(txt).get('built') or ''
              except Exception: return ''
          remote = subprocess.run(['git', 'show', 'origin/main:data/state/system_fires.json'], capture_output=True, text=True).stdout
          local = open('data/state/system_fires.json').read()
          if built(remote) > built(local):
              print(f"[commit] tracker build {built(remote)} on main is newer than this job's {built(local)}: keeping main's system files")
              subprocess.run(['git', 'checkout', '-q', 'origin/main', '--', 'data/state/system_fires.json', 'data/state/system_fired.json'])
          PY
          python3 sharp/merge_state.py origin/main || true     # 11/7: keep every fill / fire either job logged (no more whole-file overwrites)
          for f in data/state/flow_live.json data/state/tape_health.json \
                   data/state/system_fired.json data/state/system_fires.json data/state/fills.jsonl data/state/tennis_watch.json data/tennis/fs_paper.jsonl data/tennis/fs_graded.json data/tennis/hot_paper.jsonl data/tennis/hot_graded.json data/tennis/serve_paper.jsonl data/tennis/serve_graded.json data/tennis/hotdog_paper.jsonl data/tennis/hotdog_graded.json data/state/mma_steam.json data/mma/oddsapi_live.jsonl data/mma/oddsapi_open.json data/mma/steam_paper.jsonl data/mma/steam_graded.json data/tennis/results.jsonl data/tennis/schedule.json data/state/bet_log.json data/state/bet_paths.json data/state/audit.json \
                   data/kalshi/steam_rev_paper.jsonl data/kalshi/steam_rev_results.json data/state/stale_paper.jsonl data/state/stale_live.json data/state/props_paper.jsonl data/state/props_live.json data/state/curve_paper.jsonl data/state/curve_live.json data/state/offers.json data/state/offers_paper.jsonl data/state/offers_record.json; do [ -e "$f" ] && git add -A "$f"; done
          git commit -q -m "signals $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          git stash -u -q || true
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs --no-tags origin main && git push -q; then
              GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" -f ref=main || true
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
