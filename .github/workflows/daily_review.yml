name: daily signal review (yesterday, by family, sport and timing)
# Runs sharp/day_review.py for the previous ET day once results are in: every watch family (notable moves, other moves, big vs small
# money, Kalshi 4-point movers, system fills) graded by sport, with the price path after each signal (tail at once vs wait).
# Output: data/research/day_review_<date>.json and .txt.
on:
  schedule:
    - cron: '41 15 * * *'     # 10:41 AM EST / 11:41 AM EDT
  workflow_dispatch:
    inputs:
      day:
        description: "ET date to review (YYYY-MM-DD); blank = yesterday"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pandas
      - name: review
        run: python3 sharp/day_review.py ${{ github.event.inputs.day }}
      - name: grade the watch-signal snapshots (agree vs conflict, price vs money)
        run: python3 sharp/signal_grade.py || true
      - name: commit
        run: |
          git config user.name "review-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/research/day_review_* data/research/signal_grade.json 2>/dev/null; git add data/research/day_review_* && git commit -m "daily review $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --no-tags origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
