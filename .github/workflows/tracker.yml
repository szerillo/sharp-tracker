name: tracker (fold, grade, export)
# Rebuilds the tracker view from the price logs, pulls results, grades fills, refits weights (gated), exports data/state/dashboard.json.
# 11/7: hourly at :40 from 9:40 AM to 9:40 PM ET, dispatched by pulse.yml (11/4 to 11/6: three times a day). The live market / sharp / tennis board and the bet tracker refresh every
# 20 minutes in signals.yml, without the price-database rebuild.
on:
  schedule:
    - cron: '41 15,19,22 * * *'   # UTC: backup clock for 10:41 AM, 2:41 PM, 5:41 PM ET (pulse dispatches these; 11/4: systems a few times a day)
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write      # publishes Pages itself once the board is pushed (the pulse's Pages slot fired mid-run and shipped the previous board)
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # build_db alone takes about 12 min now; the 20-min limit killed every run from 11/3 midday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q cryptography numpy pandas
      - name: Novig settled-market history -> catalog (needs NOVIG_* secrets; skips without them)
        env:
          NOVIG_KEY_ID: ${{ secrets.NOVIG_KEY_ID }}
          NOVIG_PRIVATE_KEY: ${{ secrets.NOVIG_PRIVATE_KEY }}
        run: python3 loggers/novig_history.py --all --max-pages 4 || true
      - name: Novig public tape (new days only; publishes after midnight ET)
        run: python3 loggers/novig_tape.py --days 2 || true
      - name: tennis schedule and set-by-set results (ESPN ATP/WTA)
        run: python3 loggers/tennis_scores.py --days-back 2 || true
      - name: price database from the last 4 days of ticks (the full 10-day build took 27 min)
        env: {BUILD_DAYS: '4'}
        run: python3 sharp/build_db.py
      - run: python3 sharp/results.py
      - run: python3 sharp/grade.py
      - name: season logs (ESPN scores + DK close) for the systems engine
        run: python3 -m sharp.season nfl nhl nba cfb cbb || true
      - name: systems engine (pre-registered rules -> paper fills)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: |     # 11/6: a crash used to pass silently; now it alerts, and the job still commits everything else
          if ! python3 sharp/systems.py; then
            echo "::error::Systems engine failed"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Systems engine failed" -H "Priority: high" -d "Systems engine crashed in run $GITHUB_RUN_ID; the board keeps the previous build" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: import real fills from the exchanges (Novig / Kalshi keys; skips without them)
        env:
          NOVIG_KEY_ID: ${{ secrets.NOVIG_KEY_ID }}
          NOVIG_PRIVATE_KEY: ${{ secrets.NOVIG_PRIVATE_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python3 sharp/exchange_fills.py || true
      - run: python3 -m sharp.fills grade
      - name: move-based sharp signals (Pinnacle steam, exchange lead, juice, timing, limits) on the tick log
        run: python3 sharp/move_signals.py || true
      - name: signal snapshot per game x market (agree vs conflict, graded later)
        run: python3 sharp/signal_log.py || true
      - name: remove duplicate bets from the records (one fill per rule per game, one tennis pick per match)
        run: python3 sharp/dedupe_fills.py || true
      - run: python3 sharp/weights_fit.py
      - run: python3 sharp/export.py
      - name: roll off raw ticks older than 10 days to the raw-archive release
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: python3 sharp/rolloff.py || true
      - name: read the latest signal files from main (owned by the signals and prices jobs)
        run: git fetch -q origin main && git checkout -q origin/main -- data/state/flow_live.json data/state/tennis_watch.json data/state/bet_log.json data/state/sharp_accounts.json data/state/sharp_paper.jsonl data/tennis/fs_paper.jsonl || true
      - name: board audit (open bets on the board, freshness, duplicates, feeds; red banner + phone alert on a new failure)
        env: {NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'}
        run: python3 sharp/audit.py || true
      - name: commit
        run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && python3 sharp/merge_state.py origin/main || true     # 11/7: keep every fill / fire the signals job logged meanwhile
          for d in data/*/ticks5 data/kalshi/trades5 data/novig/trades5; do [ -d "$d" ] && git add -A "$d"; done
          git add -A data/state data/tennis data/kalshi/steam_rev_paper.jsonl data/kalshi/steam_rev_results.json data/research/signal_log.jsonl data/novig/daily data/novig/catalog data/novig/_history_state.json data/nfl/season.json data/nfl/ticks data/nba/ticks data/cfb/ticks data/nhl/ticks data/soccer/ticks data/mma/ticks data/nhl/season.json data/nba/season.json data/cfb/season.json data/cbb/season.json data/polymarket && git commit -m "tracker $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --no-tags origin main && git push; then
              GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" -f ref=main || true
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
