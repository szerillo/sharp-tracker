name: polymarket sharp list (monthly rescore)
# Adds the month's settled Polymarket game markets to the running per-account record (data/research/poly_agg.json.gz) and rebuilds the
# top-200 sharp list the 5-minute job follows (data/state/poly_sharps_list.json). sharp/poly_agg.py --update.
on:
  schedule:
    - cron: '23 9 1 * *'     # 1st of each month, 4:23 AM ET (EST) / 5:23 AM ET (EDT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: add the new settled markets and rebuild the list
        run: python3 sharp/poly_agg.py --update
      - name: commit
        run: |
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/research/poly_agg.json.gz data/state/poly_sharps_list.json && git commit -m "poly sharp list $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --no-tags origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
