name: prices (20-minute price log)
# The venue loggers on their own schedule and concurrency group, no sleeps. Every 20 min, 10 AM to 1:59 AM ET (cron is UTC, EDT = UTC-4).
on:
  schedule:
    - cron: '0,20,40 14-23,0-5 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 loggers/mlb/game_lines.py || true
      - run: python3 loggers/mlb/kalshi_props.py || true
      - run: python3 loggers/mlb/novig.py || true
      - run: python3 loggers/mlb/an_props.py || true
      - run: python3 loggers/mlb/pinnacle_props.py || true
      - name: commit
        run: |
          git config user.name "prices-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/mlb && git commit -m "prices $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
