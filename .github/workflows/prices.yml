name: prices (20-minute price log)
# The venue loggers on their own schedule and concurrency group, no sleeps. Every 20 min, 10 AM to 1:59 AM ET (cron is UTC, EDT = UTC-4).
on:
  schedule:
    - cron: '0,20,40 14-23,0-5 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 loggers/mlb/game_lines.py || true
      - run: python3 loggers/mlb/kalshi_props.py || true
      - run: python3 loggers/mlb/novig.py || true
      - run: python3 loggers/mlb/an_props.py || true
      - run: python3 loggers/mlb/pinnacle_props.py || true
      - name: Polymarket (Gamma + CLOB books + public trades; every sport tag, games inside 36h)
        run: python3 loggers/polymarket.py || true
      - name: Novig catalog snapshot (every league; makes the public tape decodable)
        run: python3 loggers/novig_catalog.py || true
      - name: NFL kickoff weather forecasts (Open-Meteo; pre-registered wind 10-14 under tests)
        run: |
          python3 loggers/nfl/weather.py || true
          python3 loggers/nfl/weather.py --sport cfb || true
      - name: commit
        run: |
          git config user.name "prices-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/mlb data/novig/catalog data/polymarket data/nfl/weather data/cfb/weather && git commit -m "prices $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        sport: [nfl, nba, cfb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: ${{ matrix.sport }} game lines + props (Pinnacle, Kalshi, Action Network, Novig) -> normalised ticks
        timeout-minutes: 9
        env:
          LINES_BUDGET_S: '420'
          NOVIG_KEY_ID: ${{ secrets.NOVIG_KEY_ID }}
          NOVIG_PRIVATE_KEY: ${{ secrets.NOVIG_PRIVATE_KEY }}
        run: pip install -q cryptography && python3 loggers/lines.py --sport ${{ matrix.sport }} || true
      - name: commit
        run: |
          git config user.name "prices-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/${{ matrix.sport }} && git commit -m "lines ${{ matrix.sport }} $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
