<style>
  /* Action Winners Circle (11/2): Action Network palette (black, white, Action green #00c358, the check), with a checkered-flag
     racing band as the one loud element. Poppins = AN's header face; Mona Sans = body and numbers (tabular). Board is light, header black. */
  :root{--bg:#F2F3F8;--panel:#fff;--panel2:#F7F8FD;--border:#DEDFE4;--text:#1D1D25;--muted:#6E6E76;--faint:#A4A4AA;
        --green:#00c358;--greenink:#00813a;--black:#000;--bad:#d81f2e;--warn:#9a6700;--gold:#ffb724;
        --led:var(--text);--good:var(--greenink);--accent:var(--green);--over:var(--greenink);--under:#c2410c;--x:#0079f0;--sharp:var(--text);
        --check:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/14px 14px;
        --gcheck:repeating-conic-gradient(#000 0 25%,var(--green) 0 50%) 0 0/10px 10px;
        --okbg:#effbf4;--okbd:#a8e6c2;--badbg:#fff3f4;--badbd:#f5b5ba;--warnbg:#fff9ea;--warnbd:#f3d48a;--warnink:#6b4a00;--badink:#8a1520;--hover:#f7fdf9;--xbg:#e6f1fe;--xbd:#b9d8fb;--xink:#0059b3;--gonebg:#ececf1;--goneink:#3a3a42;--gonebd:#d4d5dc;--onfg:#fff;color-scheme:light}
  /* dark mode (Sean, 11/4): follows the system setting, or the ☾ / ☀ switch in the header (remembered in this browser) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#171a21;--panel2:#1d2129;--border:#2a2f3a;--text:#e8e9ee;--muted:#9a9ca8;--faint:#6b6e7a;
        --green:#00c358;--greenink:#3ddc84;--black:#000;--bad:#ff6b76;--warn:#e0b352;--gold:#ffb724;--over:#3ddc84;--under:#ff9b5c;--x:#5aa9ff;
        --check:repeating-conic-gradient(#000 0 25%,#e8e9ee 0 50%) 0 0/14px 14px;
        --okbg:#0f2a1c;--okbd:#1f5a3a;--badbg:#2e1417;--badbd:#6a2a31;--warnbg:#2b2311;--warnbd:#6a5520;--warnink:#f0cf7a;--badink:#ff8f98;--hover:#1a2a20;
        --xbg:#122238;--xbd:#2a4f80;--xink:#7fb8ff;--gonebg:#23262e;--goneink:#b7b9c2;--gonebd:#3a3e48;--onfg:#fff;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#0f1115;--panel:#171a21;--panel2:#1d2129;--border:#2a2f3a;--text:#e8e9ee;--muted:#9a9ca8;--faint:#6b6e7a;
        --green:#00c358;--greenink:#3ddc84;--black:#000;--bad:#ff6b76;--warn:#e0b352;--gold:#ffb724;--over:#3ddc84;--under:#ff9b5c;--x:#5aa9ff;
        --check:repeating-conic-gradient(#000 0 25%,#e8e9ee 0 50%) 0 0/14px 14px;
        --okbg:#0f2a1c;--okbd:#1f5a3a;--badbg:#2e1417;--badbd:#6a2a31;--warnbg:#2b2311;--warnbd:#6a5520;--warnink:#f0cf7a;--badink:#ff8f98;--hover:#1a2a20;
        --xbg:#122238;--xbd:#2a4f80;--xink:#7fb8ff;--gonebg:#23262e;--goneink:#b7b9c2;--gonebd:#3a3e48;--onfg:#fff;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font:15px/1.45 'Mona Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg)}
  b,strong{font-weight:600}
  a{color:var(--x)}
  /* the header: black, the check, then the checkered flag */
  .hdr{background:var(--black);color:#fff}
  .hdr-in{max-width:1360px;margin:0 auto;padding:16px 16px 14px;display:flex;align-items:center;gap:12px}
  .hdr img{width:38px;height:38px;flex:none}
  .theme{margin-left:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;width:34px;height:34px;font-size:17px;cursor:pointer;line-height:1} .theme:hover{border-color:#fff}
  h1{margin:0;font:italic 800 30px/1 Poppins,sans-serif;letter-spacing:-.01em;color:#fff}
  h1 .ac{color:var(--green)}
  h1 #sporthdr{font:600 16px Poppins,sans-serif;font-style:normal;color:var(--faint);margin-left:6px;letter-spacing:0}
  h1 #sporthdr #sportname{color:#fff}
  .flag{height:14px;background:var(--check)}
  .flag2{height:4px;background:var(--green)}
  .wrap{max-width:1360px;margin:0 auto;padding:12px 16px 60px}
  h2{font:700 21px Poppins,sans-serif;letter-spacing:-.01em;color:var(--text)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
  .pill{border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted);background:var(--panel)}
  .pill b{color:var(--text)} .pill.ok{color:var(--greenink);border-color:var(--okbd);background:var(--okbg)} .pill.bad{color:var(--bad);border-color:var(--badbd);background:var(--badbg)} .pill.warn{color:var(--warn);border-color:var(--warnbd);background:var(--warnbg)}
  /* tabs: AN's pill nav, active = black with green underline */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
  .tabs button{background:var(--panel);border:1px solid var(--border);border-radius:999px;color:var(--text);padding:6px 15px;cursor:pointer;font:600 14px Poppins,sans-serif}
  .tabs button:hover{border-color:var(--text)}
  .tabs button.on{color:var(--onfg);background:var(--black);border-color:var(--black);box-shadow:inset 0 -3px 0 var(--green)} :root[data-theme="dark"] .tabs button.on,:root:not([data-theme="light"]) .tabs button.on{border-color:var(--border)}
  .tabs button:focus-visible,.betbtn:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .banner{background:var(--warnbg);border:1px solid var(--warnbd);color:var(--warnink);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
  .banner.red{background:var(--badbg);border-color:var(--badbd);color:var(--badink)}
  .sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}
  .sec-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .sec-h .name{font:700 16px Poppins,sans-serif} .sec-h .meta{color:var(--muted);font-size:13px} .sec-h .right{margin-left:auto;font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top} tr:hover td{background:var(--hover)}
  .mono,.price,.num,.card .price,.brow .price,.lad .p,.tile .k{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
  .num{text-align:right} th.num{text-align:right}
  .pos{color:var(--greenink);font-weight:700} .neg{color:var(--bad);font-weight:600} .dim{color:var(--faint)}
  .badge{display:inline-block;font:600 11.5px 'Mona Sans',sans-serif;border-radius:4px;padding:1px 6px;margin-left:4px;border:1px solid transparent;vertical-align:1px}
  .b-prior{background:var(--warnbg);color:var(--warnink)} .b-fit{background:var(--okbg);color:var(--greenink)} .b-x{background:var(--xbg);color:var(--xink)}
  .b-stale{background:var(--badbg);color:var(--badink)} .b-gate{background:var(--panel2);color:var(--muted);border-color:var(--border)}
  .chip{display:inline-block;border:1px solid var(--border);border-radius:6px;padding:0 6px;margin:1px 2px 1px 0;font-size:13px;background:var(--panel);white-space:nowrap}
  .chip.x{border-color:var(--xbd)} .chip.sharp{border-color:var(--text)} .chip.off{opacity:.45;text-decoration:line-through} .chip .p{font-weight:600}
  .chip.best{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--okbg)}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px} .bar i{display:block;height:100%;background:var(--green)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--muted)}
  .controls select,.controls input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font:inherit;font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px} .tile .k{font:700 26px Poppins,sans-serif} .tile .l{font-size:13px;color:var(--muted)}
  .side-over{color:var(--over)} .side-under{color:var(--under)}
  details>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 14px;list-style:none} details>summary::-webkit-details-marker{display:none}
  .small{font-size:13.5px;color:var(--muted)}
  details.game>summary{list-style:none;cursor:pointer} details.game>summary::-webkit-details-marker{display:none} details.game>summary .name::before{content:'▸ ';color:var(--muted)} details.game[open]>summary .name::before{content:'▾ '}
  .tabs.inline{display:inline-flex;border:0;margin:0 8px 0 0;padding:0} .tabs.inline button{padding:3px 11px;font-size:13px}
  .b-sport{background:var(--black);color:#fff;font-size:11px;padding:1px 6px}
  .erow:hover td{background:var(--hover)}
  .lad{display:inline-block;margin:2px 6px 2px 0;padding:0 6px;border:1px solid var(--border);border-radius:6px;font-size:13px} .lad.x{border-color:var(--xbd)}
  @media (max-width:760px){.hide-m{display:none}}
  .sub2 button{font-size:13px;padding:4px 11px} .sub2{margin-top:-4px}
  .sub2 button.on{background:var(--green);color:#000;border-color:var(--green);box-shadow:none}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;display:grid;grid-template-columns:150px 1fr 230px;gap:12px;align-items:start}
  .card .when{font-size:14px} .card .when b{font-size:16px} .card .bet{font:700 19px Poppins,sans-serif;margin:2px 0} .card .why{font-size:13.5px;color:var(--muted);margin-top:4px}
  .ok-chip{color:var(--greenink)} .moved-chip{color:var(--warn)} .gone-chip{color:var(--under)}
  /* section headers sit on a thin green-and-black checker rule: the racing motif, kept small */
  .hdr2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:24px 0 8px;padding-bottom:8px;position:relative} .hdr2 h2{margin:0} .hdr2 .meta{font-size:13.5px;color:var(--muted)}
  .hdr2::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--gcheck);background-size:5px 5px;opacity:.9}
  .explain{font-size:14px;color:var(--muted);margin:0 0 6px;max-width:72ch;line-height:1.55}
  @media (max-width:760px){.card{grid-template-columns:1fr} h1{font-size:23px} h1 #sporthdr{display:block;margin:4px 0 0} .hdr img{width:32px;height:32px}}
  .topbar{gap:6px 12px;margin-top:2px} .tabs.inline.when button.on .small{color:#fff}
  .summary{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:8px;padding:8px 12px;font-size:15px;margin:4px 0 2px}
  .gcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
  .ghead{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:14.5px}
  .ghead .gname{font:600 15px Poppins,sans-serif;margin-left:4px}
  .brow{display:grid;grid-template-columns:210px 1fr 220px;gap:12px;padding:12px 14px;border-top:1px solid var(--border)} .brow:first-of-type{border-top:0}
  .brow .bet{font:700 19px Poppins,sans-serif;letter-spacing:-.01em}
  .sig{font-size:14px;margin-top:4px} .sig .kind{display:inline-block;min-width:118px;font-size:12px;font-weight:600;color:var(--muted)}
  .click{cursor:pointer} tr.click:hover td{background:var(--hover)} .chev{display:inline-block;width:12px;color:var(--muted);font-weight:600}
  .betbtn{display:inline-block;background:var(--green);color:#000;border:0;border-radius:999px;padding:2px 11px;font:600 12.5px Poppins,sans-serif;text-decoration:none;white-space:nowrap}
  .betbtn:hover{background:var(--text);color:var(--bg)}
  details.how>summary{display:inline-block;border:0;padding:2px 0 6px;margin:2px 0 6px;font-size:14px;color:var(--x);background:none} details.how>summary::before{content:'▸ '} details.how[open]>summary::before{content:'▾ '}
  details.how>summary:hover{color:var(--text)}
  .mixed{color:var(--warn);font-weight:600} .fam{display:inline-block;width:62px;font-size:12px;color:var(--muted)}
  .b-watch{background:var(--warnbg);color:var(--warnink)} .bet.mixed{color:var(--warn)}
  .tag-with{color:var(--greenink);font-size:13px;font-weight:600} .tag-against{color:var(--under);font-size:13px;font-weight:600}
  @media (max-width:760px){.brow{grid-template-columns:1fr}}
  .slip{margin-top:5px;font-size:13.5px;color:var(--text)} .slip b{font-weight:700;color:var(--greenink)}
  /* flagged earlier, since gone: kept on the board, greyed (still counted in the record) */
  .gone td{opacity:.42} .gone td.c-bet{opacity:1} .gone td.c-bet .small{opacity:.5}
  /* the one row shape (11/2): compact table for bets, leans and signals */
  .slipt td{vertical-align:top;padding:9px 10px} .slipt th{padding:7px 10px}
  .slipt .c-when{white-space:nowrap;width:92px} .slipt .c-game{width:210px} .slipt .c-size{white-space:nowrap;width:64px} .slipt .c-price{width:260px;font-size:14px}
  .slipt .c-bet .bet{font:700 15px Poppins,sans-serif} .slipt .c-why{font-size:13px;color:var(--muted);max-width:330px} .slipt .c-rec{white-space:nowrap;font-size:12.5px;width:170px}
  .why2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .go{margin-top:5px} .lbl{display:inline-block;min-width:60px;margin-right:6px;color:var(--faint);font-size:11.5px;white-space:nowrap}
  tr.det td{background:var(--panel2);padding:10px 14px 14px;font-size:13.5px}

    .slipt tr.erow td.c-game,.slipt tr.erow td.c-why,.slipt tr.erow td.c-rec{display:none} .slipt tr.det{display:block} .slipt tr.det td{display:block} .facts{grid-template-columns:1fr} .facts dt{margin-top:6px}}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const am = p => p == null ? '—' : (p > 0 ? '+' : '') + p;
const pct = (p, d = 1) => p == null ? '—' : (100 * p).toFixed(d);
const MKT0 = {ml:'Moneyline', rl:'Run line', spread:'Spread', total:'Total', tt_away:'Team total (away)', tt_home:'Team total (home)', f5_ml:'F5 moneyline', f5_rl:'F5 run line',
             f5_total:'F5 total', f5_tt_away:'F5 team total (away)', f5_tt_home:'F5 team total (home)', rfi:'1st inning (YRFI/NRFI)'};
const MKT = new Proxy(MKT0, {get(t, k) { if (k in t) return t[k]; const m = /^(1h|1q|1p)_(.*)$/.exec(k); return m ? ({'1h': '1H ', '1q': '1Q ', '1p': '1st period '}[m[1]]) + (t[m[2]] || m[2]) : undefined; }});
let SPORT = new URLSearchParams(location.search).get('sport') || null;
const XV = new Set(['Kalshi', 'Novig', 'Polymarket']), SHARP = new Set(['Pinnacle', 'Circa']);
const ET = iso => new Date(iso).toLocaleString('en-US', {timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
let D = null, E = null, MV = null, SY = null, FL = null, TW = null, SN = null, SA = null, BL = null, AU = null, tab = new URLSearchParams(location.search).get('tab') || 'today';
const TABS = [['today', 'Today'], ['tracker', 'Bet tracker'], ['games', 'Games'], ['systems', 'Systems'], ['moves', 'Market moves'], ['more', 'More']];
const RTABS = [['edges', 'Off-market prices'], ['ledger', 'Bet ledger'], ['weekly', 'Weekly report'], ['venues', 'Which books lead'], ['board', 'Full odds board'], ['props', 'Prop list'], ['health', 'Data health'], ['constants', 'Settings']];
let rtab = new URLSearchParams(location.search).get('r') || 'edges';

const STATL = {MOV_DEC: 'wins by decision', MOV_KO: 'wins by KO/TKO', MOV_SUB: 'wins by submission', ITD: 'wins inside the distance', DIST: 'goes the distance', STARTR2: 'reaches round 2', STARTR3: 'reaches round 3', STARTR4: 'reaches round 4', STARTR5: 'reaches round 5'};
const PROPL = {PTS: 'points', REB: 'rebounds', AST: 'assists', PRA: 'pts + reb + ast', PR: 'pts + reb', PA: 'pts + ast', RA: 'reb + ast', STL: 'steals', BLK: 'blocks', '3PM': '3-pointers made', TO: 'turnovers',
  SOG: 'shots on goal', GOALS: 'goals', SAVES: 'saves', SOT: 'shots on target', PASSYDS: 'passing yards', PASSTD: 'passing TDs', PASSATT: 'pass attempts', PASSCMP: 'completions', INT: 'interceptions',
  RUSHYDS: 'rushing yards', RUSHATT: 'rush attempts', RECYDS: 'receiving yards', REC: 'receptions', ANYTD: 'anytime TD', K: 'strikeouts', HRR: 'hits + runs + RBIs', TB: 'total bases', H: 'hits', HR: 'home runs', ER: 'earned runs'};
const statLabel = s => STATL[s] || PROPL[s] || s;
const yesNo = c => c.stat in STATL;
function sideLabel(c, g) {
  if (yesNo(c)) return `<span class="side-${c.side}">${c.side === 'over' ? 'Yes' : 'No'}</span>`;
  if (c.side === 'home' || c.side === 'away') return (c.participant || c.side) + (c.line != null ? ' ' + (c.line > 0 ? '+' : '') + c.line : '');
  const who = c.participant && c.market.includes('tt') ? c.participant + ' ' : (c.player ? c.player + ' ' : '');
  return `${who}<span class="side-${c.side}">${c.side === 'over' ? 'Over' : 'Under'} ${c.line}</span>`;
}
function fairCell(c) {
  if (c.fair == null) return `<span class="dim">— <span class="small">(${c.fair_n} venue${c.fair_n === 1 ? '' : 's'})</span></span>`;
  return `<span class="mono">${pct(c.fair)}%</span> <span class="dim mono">${am(c.fair_american)}</span><span class="badge ${c.fair_status === 'fitted' ? 'b-fit' : 'b-prior'}">${c.fair_status === 'fitted' ? 'fitted' : 'prior wts'}</span><span class="small"> n=${c.fair_n}</span>`;
}
function bestCell(c) {
  if (!c.best || !c.best.length) return '<span class="dim">—</span>';
  const b = c.best[0]; const fee = b.cost_american !== b.american ? ` <span class="dim small">(${am(b.cost_american)} after fee)</span>` : '';
  const more = c.best.slice(1, 3).map(x => `<span class="dim small">${VEN(x.venue)} ${am(x.american)}</span>`).join(' · ');
  return `<b>${VEN(b.venue)}</b> <span class="mono">${am(b.american)}</span>${fee}${b.limit ? ` <span class="dim small">lim $${b.limit}</span>` : ''}<br>${more}`;
}
function edgeCell(c) {
  if (c.edge_pts == null) return '<span class="dim">—</span>';
  const cls = c.edge_pts >= 1 ? 'pos' : (c.edge_pts < 0 ? 'neg' : 'dim');
  return `<span class="mono ${cls}">${c.edge_pts > 0 ? '+' : ''}${c.edge_pts.toFixed(1)}</span>`;
}
function ladder(c) {
  const bestV = c.best && c.best[0] ? c.best[0].venue : null;
  return c.ladder.map(l => {
    const cls = ['chip', XV.has(l.venue) ? 'x' : (SHARP.has(l.venue) ? 'sharp' : ''), l.p == null ? 'off' : '', l.venue === bestV ? 'best' : ''].join(' ');
    const raw = l.american != null ? am(l.american) : (l.ask != null ? l.ask.toFixed(2) : '');
    const tip = `${l.venue}: ${raw}${l.bid != null ? ` bid ${l.bid} / ask ${l.ask}` : ''}${l.limit ? ` · limit $${l.limit}` : ''} · ${l.age_min} min old · weight ${l.w}${l.why ? ' · excluded: ' + l.why : ''}${l.flags ? ' · ' + l.flags : ''}`;
    return `<span class="${cls}" title="${esc(tip)}">${esc(l.venue)} <span class="p">${l.p == null ? l.why : pct(l.p, 1)}</span></span>`;
  }).join('');
}

const FULLNAME = new Set(['mma', 'cfb', 'soccer', 'cbb']);
function gname(g) { return FULLNAME.has(SPORT) && (g.away_name || g.home_name) ? `${esc(g.away_name || g.away)} @ ${esc(g.home_name || g.home)}` : `${esc(g.away)} @ ${esc(g.home)}`; }
function renderBoard() {
  if (!D.board.length) return '<div class="sec"><div class="sec-h"><span class="name">No upcoming games in the log</span></div></div>';
  const ctl = `<div class="controls"><button onclick="window._openAll=true;draw()">expand all</button> <button onclick="window._openAll=false;window._open={};draw()">collapse all</button> <span>${D.board.length} games · click a game to expand</span></div>`;
  return ctl + D.board.map(g => {
    const stale = g.closed ? `<span class="badge b-gate">started · closed at the final pregame line (${ET(g.priced_at)} ET)</span>` : (g.stale_min > 60 ? `<span class="badge b-stale">priced ${g.stale_min} min ago (log stale)</span>` : '');
    const lim = Object.entries(g.pinnacle_limits || {}).filter(([m, x]) => x.first !== x.now).map(([m, x]) => `${MKT[m] || m}: $${x.first}→$${x.now}`).join(' · ');
    const rows = g.markets.map(c => `<tr>
      <td><span class="dim small">${MKT[c.market] || c.market}</span><br>${sideLabel(c, g)}</td>
      <td>${fairCell(c)}</td><td>${bestCell(c)}</td><td class="num">${edgeCell(c)}</td>
      <td class="hide-m small">${c.open_american != null ? `<span class="mono">${am(c.open_american)}</span> open` : '<span class="dim">—</span>'}</td>
      <td>${ladder(c)}</td></tr>`).join('');
    const priced = g.markets.filter(c => c.fair != null); const top = priced.slice().sort((a, b) => (b.edge_pts ?? -99) - (a.edge_pts ?? -99))[0];
    const pt = g.props.filter(c => c.fair != null).sort((a, b) => (b.edge_pts ?? -99) - (a.edge_pts ?? -99));
    const propRows = pt.slice(0, 12).map(c => `<tr><td>${esc(c.player)} <span class="dim small">${statLabel(c.stat)}</span><br>${sideLabel(c)}</td><td>${fairCell(c)}</td><td>${bestCell(c)}</td><td class="num">${edgeCell(c)}</td><td class="hide-m"></td><td>${ladder(c)}</td></tr>`).join('');
    const open = window._openAll || (window._open && window._open[g.event_id]);
    return `<details class="sec game" ${open ? 'open' : ''} ontoggle="(_open=window._open||{})['${g.event_id}']=this.open"><summary class="sec-h"><span class="name">${gname(g)}</span><span class="meta">${ET(g.start_utc)} ET · T-${Math.round(g.minutes_to_start / 60 * 10) / 10}h</span>${stale}
      <span class="meta">${priced.length} priced markets · ${pt.length} priced props</span>${top ? `<span class="meta">best: ${MKT[top.market] || top.market} ${sideLabel(top, g)} <b class="${top.edge_pts > 0 ? 'pos' : 'neg'}">${top.edge_pts > 0 ? '+' : ''}${top.edge_pts}</b> @ ${top.best[0].venue}</span>` : ''}
      <span class="right">${lim ? 'Pinnacle limits ' + lim : ''}</span></summary>
      <table><thead><tr><th>Market</th><th>Fair (ruler)</th><th>Best bettable</th><th class="num">Edge %</th><th class="hide-m">Open · public</th><th>Venue ladder (devigged %, hover for raw)</th></tr></thead><tbody>${rows}</tbody></table>
      ${propRows ? `<div class="sec-h"><span class="meta">top props for this game (${pt.length} priced; full list on the Props tab)</span></div><table><tbody>${propRows}</tbody></table>` : ''}</details>`;
  }).join('');
}

function renderProps() {
  const all = []; D.board.forEach(g => g.props.forEach(c => all.push({...c, game: gname(g), start: g.start_utc})));
  const stats = [...new Set(all.map(c => c.stat))].sort();
  const st = window._pf || (window._pf = {stat: '', side: '', minv: 3, q: ''});
  let rows = all.filter(c => (!st.stat || c.stat === st.stat) && (!st.side || c.side === st.side) && c.fair_n >= st.minv && (!st.q || (c.player || '').toLowerCase().includes(st.q.toLowerCase())));
  rows.sort((a, b) => (b.edge_pts ?? -99) - (a.edge_pts ?? -99));
  const tr = rows.slice(0, 300).map(c => `<tr><td class="small dim">${c.game}</td><td>${esc(c.player)} <span class="dim small">${statLabel(c.stat)}</span><br>${sideLabel(c)}</td>

    if (b === 'spread') return `${per}${sd} ${r.line > 0 ? '+' : ''}${r.line}`;
    return `${per}${sd} ML`; };
  const tr = r => `<tr><td class="small">${DAYT(r.start)}</td><td>${esc((r.sport || '').toUpperCase())} · ${esc(r.game)}</td><td><b>${mk(r)}</b></td><td>${esc(r.venue)}</td><td>${c(r.bid)} / ${c(r.ask)}</td><td>${c(r.fair)}</td><td><b>${c(r.offer)}</b> <span class="small dim">${toAm(r.offer)}</span></td><td>${c(r.edge)}</td></tr>`;
  const grp = (O.groups || []).slice(0, 8).map(g => `${esc(g.venue)} ${esc((g.sport || '').toUpperCase())} ${esc(g.market.replace('tt_', 'team total ').replace('_', ' '))} ${g.n}`).join(' · ');
  return `<details class="how" ${window._ofOpen ? 'open' : ''} ontoggle="window._ofOpen=this.open"><summary>Offers to rest: ${rows.length} soft prices on Kalshi and Novig (paper, not bets)</summary>
    <div class="small dim" style="margin:4px 0">Sides where the best bid is 3c or more under Pinnacle's fair price. The offer is a resting bid 2c under fair; "Kept" is what is left after Kalshi's maker fee. Games inside 24 hours. Updated ${O.updated ? DAYT(O.updated) : ''}. ${grp}</div>
    ${(() => { const R = window._OFR; if (!R || !R.all || !R.all.offers) return '<div class="small dim" style="margin:4px 0">Fill record: none started yet.</div>';
      const f = (k, x) => `${k}: ${x.filled} of ${x.offers} filled (${Math.round(100 * x.fill_rate)}%)${x.usd_per_fill ? `, $${x.usd_per_fill} a fill` : ''}${x.clv_filled != null && x.clv_filled_n ? `, filled closed ${x.clv_filled > 0 ? '+' : ''}${x.clv_filled}c vs Pinnacle (${x.clv_filled_n})` : ''}${x.clv_unfilled != null && x.clv_unfilled_n ? `, unfilled ${x.clv_unfilled > 0 ? '+' : ''}${x.clv_unfilled}c (${x.clv_unfilled_n})` : ''}`;
      return `<div class="small" style="margin:4px 0"><b>Would they have filled?</b> ${f('All', R.all)}<br>${Object.entries(R.by || {}).map(([k, x]) => f(esc(k), x)).join('<br>')}<div class="dim">A fill = a trade on the tape after the offer was logged where someone sold at or under our bid. ${R.unwatched ? R.unwatched + ' earlier offers were on markets the trade tape did not cover.' : ''}</div></div>`; })()}
    ${rows.length ? `<div style="overflow-x:auto"><table class="tbl small"><thead><tr><th>Start</th><th>Game</th><th>Side</th><th>Venue</th><th>Bid / ask now</th><th>Pinnacle fair</th><th>Offer</th><th>Kept</th></tr></thead><tbody>${rows.slice(0, 80).map(tr).join('')}</tbody></table></div>` : '<div class="small dim">Nothing 3c or more off right now.</div>'}</details>`;
}
async function load() {
  let u = new URLSearchParams(location.search).get('data') || 'data/state/dashboard.json';
  try {
    // 11/6: every side file in parallel (they were fetched one after another, 18 round trips), and kept for 2 minutes so switching
    // sports only fetches the sport's own dashboard
    const J = p => fetch(p, {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
    const SIDE = ['data/state/edges.json', 'data/state/moves.json', 'data/state/system_fires.json', 'data/state/flow_live.json', 'data/state/tennis_watch.json',
      'data/state/mma_steam.json', 'data/state/kalshi_flow.json', 'data/state/stale_live.json', 'data/state/props_live.json', 'data/state/curve_live.json',
      'data/research/poly_pinnacle.json', 'data/state/tape_health.json', 'data/state/signal_snap.json', 'data/state/sharp_accounts.json', 'data/state/bet_log.json', 'data/state/audit.json', 'data/state/offers.json', 'data/state/offers_record.json'];
    const fresh = window._SIDE && Date.now() - window._SIDE.t < 120000;
    const [d0, side] = await Promise.all([J(u), fresh ? Promise.resolve(window._SIDE.v) : Promise.all(SIDE.map(J))]);
    if (!fresh) window._SIDE = {t: Date.now(), v: side};
    if (!d0) throw new Error('no data');
    D = d0;
    [E, MV, SY, FL, TW, window._MS, window._KF, window._SL, window._PL, window._CV, window._PP, window._TH, SN, SA, BL, AU, window._OF, window._OFR] = side;
    const idx = D.index;
    if (idx && idx.sports && idx.sports.length) {
      if (!SPORT) SPORT = idx.sports[0].sport;
      const pick = idx.sports.find(s => s.sport === SPORT) || idx.sports[0]; SPORT = pick.sport;
      if (D.sport !== SPORT) D = await (await fetch(pick.file, {cache: 'no-store'})).json();
      D.index = idx;
      $('#sports').innerHTML = idx.sports.map(s => `<button class="${s.sport === SPORT ? 'on' : ''}" onclick="SPORT='${s.sport}';history.replaceState(null,'','?sport=${s.sport}');load()">${s.label} <span class="small">${s.games} games</span></button>`).join('');
    }
    $('#sportname').textContent = D.label || (D.sport || 'mlb').toUpperCase();
  } catch (e) { $('#sub').textContent = 'could not load ' + u + ' (' + e + ')'; return; }
  const built = new Date(D.built); const ageMin = Math.round((Date.now() - built) / 60000);
  $('#sub').innerHTML = `built ${ET(D.built)} ET (${ageMin} min ago) · ${D.counts.events} events · ${D.counts.settled} settled · ${D.counts.ticks.toLocaleString()} ticks · spec ${D.spec}`;
  $('#strip').innerHTML = `<span class="pill">Ruler weights: <b>${D.weights.game_status}</b> (game) · <b>${D.weights.prop_status}</b> (props)</span>
    <span class="pill ${D.board.some(g => !g.closed && g.stale_min > 60) ? 'bad' : 'ok'}">board priced ${(D.board.find(g => !g.closed) || {}).stale_min ?? '—'} min ago</span>
    <span class="pill">Test gates: A/B ${D.venues.A.game.n}/${D.venues.A.game.gate} games · C ${D.venues.C.n}/${D.venues.C.gate} pairs · D ${D.venues.D.n}/${D.venues.D.gate} prop rows</span>
    <span class="pill">Fanatics, theScore, BetRivers, BetMGM: archived only, never shown as a price</span>`;
  const b = [];
  const TH = window._TH;
  if (TH) {
    const recent = (TH.gaps || []).filter(g => (Date.now() - new Date(g.end)) < 6 * 36e5 && g.minutes >= 30 && new Date(g.end) < Date.now() - 6e4);
    if (TH.stale_min != null && TH.stale_min >= 30) b.push(`<div class="banner red">The 5-minute tape has not run for ${TH.stale_min} minutes (last ${ET(TH.last)} ET): moves, steam states and big vs small are stale.</div>`);
    else if (recent.length) b.push(`<div class="banner">The 5-minute tape missed ${recent.map(g => `${ET(g.start)} to ${ET(g.end)} ET (${g.minutes} min)`).join(', ')}: moves inside that window are not on the tape.</div>`);
  }
  if (ageMin > 90) b.push(`<div class="banner red">The export is ${ageMin} minutes old — the workflow has not run. Prices on the board are not current.</div>`);
  if (D.weights.game_status !== 'fitted') b.push(`<div class="banner">Fair prices use the <b>prior</b> weight vector (unfitted). Edges are a ruler-vs-price gap under those weights, not a validated result; nothing in the first month produces a bet on its own. Weights fit automatically once the game-line gate (${D.venues.A.game.gate} settled games) is reached.</div>`);
  $('#banners').innerHTML = b.join('');
  draw();
}
load();
// keep an open tab current: redraw every minute (rolling 24h window, countdowns), re-fetch the data every 5 minutes (the tracker
// publishes about every 20). Filters, sort and open rows live on window.* and survive both.
setInterval(() => { try { if (!document.hidden) draw(); } catch (e) {} }, 60 * 1000);
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });   // coming back to the tab: fresh data at once

(function(){ const b = document.getElementById('theme'); if (!b) return;
  const cur = () => document.documentElement.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const paint = () => { b.textContent = cur() === 'dark' ? '☀' : '☾'; };
  b.addEventListener('click', () => { const n = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('awc-theme', n); } catch (e) {} paint(); });
  paint(); })();
</script>
